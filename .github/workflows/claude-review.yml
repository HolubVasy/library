# Every pull request is reviewed by Claude against AGENTS.md; findings come back as review comments.
# Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN, made by `claude setup-token` on the owner's Max subscription.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

# a new push cancels the review still running for the same PR, so comments are not posted twice
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read AGENTS.md first: its rules are the review criteria.
            Look for, in this order:
            1. Breaks of the data rules: anything that overwrites or deletes earlier results instead of adding on top,
               a changed tool or code that is not a new method, a pass writing to a table that is not its own,
               secrets in the repository.
            2. Correctness bugs: wrong SQL, lost rows, wrong encoding, broken idempotency of a re-runnable step.
            3. Names and schemas that do not follow AGENTS.md.
            Report only real findings, each as an inline comment on the line, short, with what is wrong and what to do.
            Finish with one summary comment on the PR: the verdict and the number of findings. No praise, no style nits.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
